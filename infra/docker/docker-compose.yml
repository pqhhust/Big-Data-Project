# BrainWatch local development stack: Kafka (KRaft) + Spark + Cassandra
#
# Usage:
#   docker compose -f infra/docker/docker-compose.yml up -d
#   docker compose -f infra/docker/docker-compose.yml down
#
# Kafka UI available at http://localhost:8890
# Spark Master UI at http://localhost:8891
# Cassandra CQL at  localhost:9042 (cqlsh)
#
# End-to-end local verification: see scripts/end_to_end_local.sh.

services:
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      # KRaft mode (no Zookeeper needed)
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Topic defaults
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "4"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_LOG_RETENTION_HOURS: "24"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      # Storage
      CLUSTER_ID: "brainwatch-kafka-cluster-01"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for Kafka ..."
        sleep 10
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic eeg.raw --partitions 4 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ehr.updates --partitions 4 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic features.realtime --partitions 4 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic alerts.anomaly --partitions 2 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic dead.letter --partitions 1 --replication-factor 1
        echo "Topics created."
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8890:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: brainwatch-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  spark-master:
    image: apache/spark:3.5.4-java17
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8891:8080"
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_NO_DAEMONIZE: "true"

  spark-worker:
    image: apache/spark:3.5.4-java17
    hostname: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: 2
      SPARK_NO_DAEMONIZE: "true"

  # Cassandra is added so the full speed-layer path (lookup + join) can
  # be verified end-to-end locally without bringing up EKS. Both
  # speed_layer queries write alerts here tagged with the `source`
  # column; scripts/end_to_end_local.sh asserts both tags appear.
  cassandra:
    image: cassandra:4.1
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: brainwatch-local
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: SimpleSnitch
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12

  cassandra-init:
    image: cassandra:4.1
    depends_on:
      cassandra:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Initialising brainwatch keyspace and tables..."
        cqlsh cassandra -e "
          CREATE KEYSPACE IF NOT EXISTS brainwatch
            WITH replication = {'class':'SimpleStrategy','replication_factor':1};
          CREATE TABLE IF NOT EXISTS brainwatch.alerts (
            patient_id text,
            alert_time timestamp,
            severity text,
            anomaly_score float,
            explanation text,
            session_id text,
            source text,
            PRIMARY KEY (patient_id, alert_time)
          ) WITH CLUSTERING ORDER BY (alert_time DESC);
          CREATE TABLE IF NOT EXISTS brainwatch.patient_state (
            patient_id text PRIMARY KEY,
            last_alert_time timestamp,
            last_severity text,
            signal_quality_score float,
            anomaly_score float,
            has_critical_lab boolean,
            n_medication_changes_24h int,
            enrichment_updated_at timestamp
          );
        "
        echo "Cassandra schema applied."
    restart: "no"

volumes:
  kafka-data:
  cassandra-data:
