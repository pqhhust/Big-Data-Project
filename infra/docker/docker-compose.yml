services:
  # ---------- Kafka Cluster (3-node KRaft, no ZooKeeper) ----------
  kafka-1:
    image: apache/kafka:3.9.0
    container_name: brainwatch-kafka-1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9095,3@kafka-3:9097
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      CLUSTER_ID: "brainwatch-kafka-cluster-01"
    ports:
      - "9092:29092"
    volumes:
      - kafka1-data:/var/lib/kafka/data
    networks:
      - brainwatch-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  kafka-2:
    image: apache/kafka:3.9.0
    container_name: brainwatch-kafka-2
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9094,CONTROLLER://:9095,PLAINTEXT_HOST://:29094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9094,PLAINTEXT_HOST://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9095,3@kafka-3:9097
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "brainwatch-kafka-cluster-01"
    ports:
      - "9094:29094"
    volumes:
      - kafka2-data:/var/lib/kafka/data
    networks:
      - brainwatch-net

  kafka-3:
    image: apache/kafka:3.9.0
    container_name: brainwatch-kafka-3
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9096,CONTROLLER://:9097,PLAINTEXT_HOST://:29096
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9096,PLAINTEXT_HOST://localhost:9096
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9095,3@kafka-3:9097
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "brainwatch-kafka-cluster-01"
    ports:
      - "9096:29096"
    volumes:
      - kafka3-data:/var/lib/kafka/data
    networks:
      - brainwatch-net

  # ---------- Kafka UI ----------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: brainwatch-kafka-ui
    ports:
      - "8890:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: brainwatch
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9094,kafka-3:9096
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    networks:
      - brainwatch-net

  # ---------- Spark Cluster ----------
  spark-master:
    image: bitnami/spark:3.5
    container_name: brainwatch-spark-master
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8891
    ports:
      - "8891:8891"
      - "7077:7077"
    volumes:
      - spark-data:/opt/bitnami/spark/data
      - ../../data:/data
    networks:
      - brainwatch-net

  spark-worker-1:
    image: bitnami/spark:3.5
    container_name: brainwatch-spark-worker-1
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: 2
    depends_on:
      - spark-master
    volumes:
      - ../../data:/data
    networks:
      - brainwatch-net

  spark-worker-2:
    image: bitnami/spark:3.5
    container_name: brainwatch-spark-worker-2
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: 2
    depends_on:
      - spark-master
    volumes:
      - ../../data:/data
    networks:
      - brainwatch-net

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:
  spark-data:

networks:
  brainwatch-net:
    driver: bridge
