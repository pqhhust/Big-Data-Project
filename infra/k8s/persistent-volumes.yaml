# Persistent volume claims for the BrainWatch data lake + Cassandra.
#
# Owner: Dat.
#
# Single-node lab cluster — ReadWriteOnce, storage class mặc định của cluster.

# Last updated: 2026-05-21 by Nguyễn Đình Đạt
apiVersion: v1
kind: List
items:
  # Vùng lưu dữ liệu thô — JSONL/Parquet từ Kafka consumer
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: bronze-pvc
      namespace: brainwatch
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 20Gi

  # Vùng dữ liệu đã dedup + validate chất lượng
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: silver-pvc
      namespace: brainwatch
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 20Gi

  # Vùng rollup tổng hợp theo ngày — nhỏ nhất vì đã aggregate
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: gold-pvc
      namespace: brainwatch
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 10Gi

  # Spark Structured Streaming checkpoint — lưu offset và state
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: checkpoints-pvc
      namespace: brainwatch
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 5Gi

  # Cassandra data — alerts + patient_state tables
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: cassandra-pvc
      namespace: brainwatch
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 20Gi
