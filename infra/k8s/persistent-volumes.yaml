# PersistentVolumeClaims for the BrainWatch data lake + Cassandra.
# Uses the cluster default StorageClass; ReadWriteOnce for single-node clusters.
apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: bronze-pvc
      namespace: brainwatch
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 20Gi

  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: silver-pvc
      namespace: brainwatch
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 20Gi

  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: gold-pvc
      namespace: brainwatch
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 10Gi

  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: checkpoints-pvc
      namespace: brainwatch
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 5Gi

  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: cassandra-pvc
      namespace: brainwatch
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 20Gi
