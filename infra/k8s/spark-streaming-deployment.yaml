# Spark Structured Streaming — runs the speed layer as a long-lived Deployment
# so Kubernetes can restart it on pod failure. Spark UI exposed via a ClusterIP Service.
apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: spark-streaming
      namespace: brainwatch
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: spark-streaming
      template:
        metadata:
          labels:
            app: spark-streaming
        spec:
          containers:
            - name: spark-streaming
              image: apache/spark:3.5.4
              command:
                - /opt/bitnami/spark/bin/spark-submit
                - --master
                - local[*]
                - --packages
                - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,com.datastax.spark:spark-cassandra-connector_2.12:3.5.0
                - --conf
                - spark.sql.shuffle.partitions=8
                - --py-files
                - /opt/brainwatch/brainwatch.zip
                - -m
                - brainwatch.processing.speed_layer
                - --bronze
                - /data/lake/bronze
                - --checkpoint
                - /data/checkpoints
                - --kafka
                - kafka:9092
                - --cassandra
                - cassandra-0.cassandra-svc.brainwatch.svc.cluster.local
              envFrom:
                - configMapRef:
                    name: brainwatch-config
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
              volumeMounts:
                - name: bronze
                  mountPath: /data/lake/bronze
                  readOnly: true
                - name: checkpoints
                  mountPath: /data/checkpoints
              livenessProbe:
                tcpSocket:
                  port: 4040
                initialDelaySeconds: 60
                periodSeconds: 30
                failureThreshold: 5
              readinessProbe:
                tcpSocket:
                  port: 4040
                initialDelaySeconds: 60
                periodSeconds: 15
          volumes:
            - name: bronze
              persistentVolumeClaim:
                claimName: bronze-pvc
                readOnly: true
            - name: checkpoints
              persistentVolumeClaim:
                claimName: checkpoints-pvc

  - apiVersion: v1
    kind: Service
    metadata:
      name: spark-streaming-ui
      namespace: brainwatch
    spec:
      selector:
        app: spark-streaming
      ports:
        - name: spark-ui
          port: 4040
          targetPort: 4040
      type: ClusterIP
