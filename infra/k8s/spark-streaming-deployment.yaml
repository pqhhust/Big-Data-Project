apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-streaming
  namespace: brainwatch
  labels:
    app: spark-streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-streaming
  template:
    metadata:
      labels:
        app: spark-streaming
    spec:
      containers:
        - name: spark-streaming
          image: bitnami/spark:3.5
          command:
            - /bin/bash
            - -c
            - |
              echo "Starting BrainWatch Structured Streaming..."
              spark-submit \
                --master local[*] \
                --name brainwatch-streaming \
                --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0 \
                --conf spark.sql.shuffle.partitions=8 \
                --conf spark.streaming.stopGracefullyOnShutdown=true \
                /app/src/brainwatch/processing/streaming.py
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: EEG_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: brainwatch-config
                  key: EEG_TOPIC
            - name: EHR_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: brainwatch-config
                  key: EHR_TOPIC
            - name: ALERTS_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: brainwatch-config
                  key: ALERTS_TOPIC
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: spark-streaming
  namespace: brainwatch
spec:
  selector:
    app: spark-streaming
  ports:
    - name: spark-ui
      port: 4040
      targetPort: 4040
