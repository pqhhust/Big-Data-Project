# Spark Structured Streaming Deployment — replaces the bootstrap Job.
#
# Owner: Dat (manifest), Quang-Hung (the speed-layer code being invoked).
#
# Why a Deployment instead of a Job?  Streaming queries are long-lived and
# we want Kubernetes to restart them on pod crashes. CrashLoopBackoff is
# more useful than Job/Failed for our purposes.
#
# Dat: implement.
#   - kind: Deployment, replicas: 1, restartPolicy: Always.
#   - image: bitnami/spark:3.5
#   - command:
#       /opt/bitnami/spark/bin/spark-submit \
#         --master local[*] \
#         --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,com.datastax.spark:spark-cassandra-connector_2.12:3.5.0 \
#         --py-files /opt/brainwatch/brainwatch.zip \
#         -m brainwatch.processing.speed_layer \
#         --bronze /data/lake/bronze \
#         --checkpoint /data/checkpoints \
#         --kafka kafka:9092 \
#         --cassandra cassandra-svc
#   - volumeMounts: bronze (RO), checkpoints (RW).
#   - env from configmap brainwatch-config.
#   - liveness probe: tcp port 4040 (Spark UI).
#   - readiness probe: same.
#   - resources: requests cpu=1 mem=2Gi, limits cpu=2 mem=4Gi.
#
# Don't forget a Service exposing port 4040 if you want to reach the Spark UI
# via `kubectl port-forward`.

apiVersion: v1
kind: List
items:
  # 1. Deployment — long-lived streaming job, K8s restarts on crash
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: spark-streaming
      namespace: brainwatch
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: spark-streaming
      template:
        metadata:
          labels:
            app: spark-streaming
        spec:
          containers:
            - name: spark-streaming
              image: bitnami/spark:3.5
              command:
                - /opt/bitnami/spark/bin/spark-submit
                - --master
                - local[*]
                - --packages
                - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,com.datastax.spark:spark-cassandra-connector_2.12:3.5.0
                - --conf
                - spark.sql.shuffle.partitions=8
                - --py-files
                - /opt/brainwatch/brainwatch.zip
                - -m
                - brainwatch.processing.speed_layer
                - --bronze
                - /data/lake/bronze
                - --checkpoint
                - /data/checkpoints
                - --kafka
                - kafka:9092
                - --cassandra
                - cassandra-0.cassandra-svc.brainwatch.svc.cluster.local
              envFrom:
                - configMapRef:
                    name: brainwatch-config
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
              volumeMounts:
                - name: bronze
                  mountPath: /data/lake/bronze
                  readOnly: true
                - name: checkpoints
                  mountPath: /data/checkpoints
              livenessProbe:
                tcpSocket:
                  port: 4040
                initialDelaySeconds: 60
                periodSeconds: 30
                failureThreshold: 5
              readinessProbe:
                tcpSocket:
                  port: 4040
                initialDelaySeconds: 60
                periodSeconds: 15
          volumes:
            - name: bronze
              persistentVolumeClaim:
                claimName: bronze-pvc
                readOnly: true
            - name: checkpoints
              persistentVolumeClaim:
                claimName: checkpoints-pvc

  # 2. Service — expose Spark UI port 4040 cho kubectl port-forward
  - apiVersion: v1
    kind: Service
    metadata:
      name: spark-streaming-ui
      namespace: brainwatch
    spec:
      selector:
        app: spark-streaming
      ports:
        - name: spark-ui
          port: 4040
          targetPort: 4040
      type: ClusterIP
