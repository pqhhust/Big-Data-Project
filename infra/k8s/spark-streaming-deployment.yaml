# Spark Structured Streaming Deployment — replaces the bootstrap Job.
#
# Owner: Dat (manifest), Quang-Hung (the speed-layer code being invoked).
# Last updated: 2026-05-21 by Nguyễn Đình Đạt
#
# Dùng Deployment thay vì Job vì streaming query chạy liên tục —
# K8s tự restart khi pod crash, CrashLoopBackoff dễ debug hơn Job/Failed.
# Spark UI ở port 4040: kubectl port-forward svc/spark-streaming-ui 4040:4040

apiVersion: v1
kind: List
items:
  # 1. Deployment — long-lived streaming job, K8s restarts on crash
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: spark-streaming
      namespace: brainwatch
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: spark-streaming
      template:
        metadata:
          labels:
            app: spark-streaming
        spec:
          containers:
            - name: spark-streaming
              image: bitnami/spark:3.5
              # spark-submit chạy speed_layer ở chế độ local — dùng tất cả CPU core trong pod
              # --packages tự download connector Kafka + Cassandra khi khởi động
              # shuffle.partitions=8 phù hợp với single-node lab (mặc định 200 sẽ quá nhiều)
              command:
                - /opt/bitnami/spark/bin/spark-submit
                - --master
                - local[*]
                - --packages
                - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,com.datastax.spark:spark-cassandra-connector_2.12:3.5.0
                - --conf
                - spark.sql.shuffle.partitions=8
                - --py-files
                - /opt/brainwatch/brainwatch.zip
                - -m
                - brainwatch.processing.speed_layer
                - --bronze
                - /data/lake/bronze
                - --checkpoint
                - /data/checkpoints
                - --kafka
                - kafka:9092
                - --cassandra
                - cassandra-0.cassandra-svc.brainwatch.svc.cluster.local
              envFrom:
                - configMapRef:
                    name: brainwatch-config
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
              volumeMounts:
                - name: bronze
                  mountPath: /data/lake/bronze
                  readOnly: true
                - name: checkpoints
                  mountPath: /data/checkpoints
              # Spark UI chạy ở port 4040 — dùng để kiểm tra job đang chạy
              # initialDelaySeconds: 60 vì Spark cần ~1 phút để khởi động hoàn toàn
              livenessProbe:
                tcpSocket:
                  port: 4040
                initialDelaySeconds: 60
                periodSeconds: 30
                failureThreshold: 5
              readinessProbe:
                tcpSocket:
                  port: 4040
                initialDelaySeconds: 60
                periodSeconds: 15
          volumes:
            - name: bronze
              persistentVolumeClaim:
                claimName: bronze-pvc
                readOnly: true
            - name: checkpoints
              persistentVolumeClaim:
                claimName: checkpoints-pvc

  # 2. Service — expose Spark UI port 4040 cho kubectl port-forward
  - apiVersion: v1
    kind: Service
    metadata:
      name: spark-streaming-ui
      namespace: brainwatch
    spec:
      selector:
        app: spark-streaming
      ports:
        - name: spark-ui
          port: 4040
          targetPort: 4040
      type: ClusterIP
