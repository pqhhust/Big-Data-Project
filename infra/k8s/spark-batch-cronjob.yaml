# Daily Spark batch CronJob: bronze → silver → gold.
#
# Owner: Dat (manifest), Kim-Hung (the spark code being invoked).
# Last updated: 2026-05-21 by Nguyễn Đình Đạt
#
# Schedule: 03:00 UTC daily (low load on the cluster).
# Dat: implement.
#   - kind: CronJob, schedule: "0 3 * * *", concurrencyPolicy: Forbid.
#   - container image: bitnami/spark:3.5
#   - command:
#       /opt/bitnami/spark/bin/spark-submit \
#         --master local[*] \
#         --conf spark.sql.shuffle.partitions=8 \
#         --py-files /opt/brainwatch/brainwatch.zip \
#         /opt/brainwatch/run_batch.py
#     where run_batch.py is a tiny wrapper that calls
#     `silver_layer.main()` then `gold_layer.main()`.
#     (Kim-Hung adds run_batch.py under scripts/ once silver+gold are ready.)
#   - mount the bronze/silver/gold/checkpoints PVCs at /data/lake.
#   - env from configmap brainwatch-config.
#   - successfulJobsHistoryLimit: 3, failedJobsHistoryLimit: 3.

apiVersion: v1
kind: List
items:
  - apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: spark-batch
      namespace: brainwatch
    spec:
      schedule: "0 3 * * *"       # chạy lúc 3h sáng UTC mỗi ngày — ít tải nhất
      concurrencyPolicy: Forbid   # không cho chạy 2 job cùng lúc tránh ghi đè data
      successfulJobsHistoryLimit: 3
      failedJobsHistoryLimit: 3
      jobTemplate:
        spec:
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: spark-batch
                  image: bitnami/spark:3.5
                  # TODO: confirm exact --bronze/--silver/--gold path args with Kim-Quan
                  # once silver_layer.main() and gold_layer.main() are implemented.
                  command:
                    - /opt/bitnami/spark/bin/spark-submit
                    - --master
                    - local[*]
                    - --conf
                    - spark.sql.shuffle.partitions=8
                    - --py-files
                    - /opt/brainwatch/brainwatch.zip
                    - /opt/brainwatch/run_batch.py
                    - --bronze
                    - /data/lake/bronze
                    - --silver
                    - /data/lake/silver
                    - --gold
                    - /data/lake/gold
                  envFrom:
                    - configMapRef:
                        name: brainwatch-config
                  resources:
                    requests:
                      cpu: "1"
                      memory: 2Gi
                    limits:
                      cpu: "2"
                      memory: 4Gi
                  volumeMounts:
                    - name: bronze
                      mountPath: /data/lake/bronze
                      readOnly: true   # batch chỉ đọc bronze, không ghi
                    - name: silver
                      mountPath: /data/lake/silver
                    - name: gold
                      mountPath: /data/lake/gold
                    - name: checkpoints
                      mountPath: /data/checkpoints
              volumes:
                - name: bronze
                  persistentVolumeClaim:
                    claimName: bronze-pvc
                    readOnly: true
                - name: silver
                  persistentVolumeClaim:
                    claimName: silver-pvc
                - name: gold
                  persistentVolumeClaim:
                    claimName: gold-pvc
                - name: checkpoints
                  persistentVolumeClaim:
                    claimName: checkpoints-pvc
