# Grafana 11 — provisioned with Infinity datasource pointing at the live
# alerts JSONL on S3, and a BrainWatch dashboard with severity / timeline /
# score / patient panels. NodePort 30300 for direct external access.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: brainwatch
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
  storageClassName: gp3
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: brainwatch
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: BrainWatch Alerts (Infinity)
        uid: infinity-brainwatch
        type: yesoreyeram-infinity-datasource
        access: proxy
        isDefault: true
        jsonData:
          customHealthCheckEnabled: false
          global_queries: []
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: brainwatch
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: brainwatch
        orgId: 1
        folder: BrainWatch
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: brainwatch
  labels: {app: grafana}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  strategy: {type: Recreate}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
        runAsGroup: 472
      initContainers:
        - name: prep
          image: busybox:1.36
          securityContext: {runAsUser: 0}
          command: ["sh", "-c", "rm -rf /var/lib/grafana/lost+found && mkdir -p /var/lib/grafana && chown -R 472:472 /var/lib/grafana"]
          volumeMounts:
            - {name: grafana-data, mountPath: /var/lib/grafana}
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          ports:
            - {containerPort: 3000, name: http}
          env:
            - {name: GF_SECURITY_ADMIN_USER,     value: admin}
            - {name: GF_SECURITY_ADMIN_PASSWORD, value: brainwatch}
            - {name: GF_AUTH_ANONYMOUS_ENABLED,  value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_INSTALL_PLUGINS,         value: yesoreyeram-infinity-datasource}
            - {name: GF_FEATURE_TOGGLES_ENABLE,  value: "publicDashboards"}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/brainwatch.json}
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits:   {cpu: "1",  memory: 1Gi}
          volumeMounts:
            - {name: grafana-data,                mountPath: /var/lib/grafana}
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
            - {name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: dashboard-json, mountPath: /var/lib/grafana/dashboards}
      volumes:
        - {name: grafana-data,       persistentVolumeClaim: {claimName: grafana-data}}
        - {name: datasources,        configMap: {name: grafana-datasources}}
        - {name: dashboard-provider, configMap: {name: grafana-dashboard-provider}}
        - {name: dashboard-json,     configMap: {name: grafana-dashboard-brainwatch}}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: brainwatch
spec:
  type: NodePort
  selector: {app: grafana}
  ports:
    - {name: http, port: 3000, targetPort: 3000, nodePort: 30300}
