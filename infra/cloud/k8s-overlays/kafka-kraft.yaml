# Single-broker Kafka in KRaft mode (no ZooKeeper) for the EKS demo.
# Uses the official apache/kafka image which has a stable repository.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: brainwatch
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        - name: clean-lost-found
          image: busybox:1.36
          command: ["sh", "-c", "rm -rf /var/lib/kafka/data/lost+found && mkdir -p /var/lib/kafka/data && chown -R 1000:1000 /var/lib/kafka/data"]
          securityContext: {runAsUser: 0}
          volumeMounts:
            - {name: kafka-data, mountPath: /var/lib/kafka/data}
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          ports:
            - {containerPort: 9092, name: external}
            - {containerPort: 9093, name: controller}
          env:
            - {name: KAFKA_NODE_ID,                value: "1"}
            - {name: KAFKA_PROCESS_ROLES,          value: "broker,controller"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka-0.kafka.brainwatch.svc.cluster.local:9093"}
            - {name: KAFKA_LISTENERS,              value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS,   value: "PLAINTEXT://kafka-0.kafka.brainwatch.svc.cluster.local:9092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true"}
            - {name: KAFKA_NUM_PARTITIONS,         value: "4"}
            - {name: KAFKA_LOG_RETENTION_HOURS,    value: "24"}
            - {name: KAFKA_LOG_DIRS,               value: "/var/lib/kafka/data"}
            - {name: CLUSTER_ID,                   value: "MkU3OEVBNTcwNTJENDM2Qk"}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits:   {cpu: "1",  memory: 2Gi}
          volumeMounts:
            - {name: kafka-data, mountPath: /var/lib/kafka/data}
  volumeClaimTemplates:
    - metadata: {name: kafka-data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: brainwatch
spec:
  selector: {app: kafka}
  ports:
    - {name: external, port: 9092, targetPort: 9092}
  clusterIP: None
